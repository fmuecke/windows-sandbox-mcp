# Builds and runs the tests against the fake wsb.exe (no Windows Sandbox needed).
# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a pre-release) also packages the
# build in the same job, after the tests passed. The release job then attests it
# and publishes it as a GitHub release.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Determine version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_TYPE -eq 'tag') {
              if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
                  throw "Tag '$env:TAG' is not of the form vX.Y.Z or vX.Y.Z-suffix."
              }
              $version = $Matches[1]
              $prerelease = ([bool]$Matches[2]).ToString().ToLowerInvariant()
          } else {
              # Untagged builds keep the csproj version.
              $version = ''
              $prerelease = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $versionArg = if ($env:VERSION) { @("-p:Version=$env:VERSION") } else { @() }
          dotnet build -c Release @versionArg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Broker tests
        run: dotnet run --project tests/WsbMcp.Tests -c Release --no-build
      - name: PowerShell module tests (PowerShell 7)
        shell: pwsh
        run: ./tests/WindowsSandboxTest.Tests.ps1
      - name: PowerShell module tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/WindowsSandboxTest.Tests.ps1

      # Release packaging: same runner, SDK and build output as the tests above.
      - name: Package release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/WsbMcp -c Release --no-build -o publish
          if ($LASTEXITCODE) { throw "dotnet publish failed ($LASTEXITCODE)." }
          $product = (Get-Item publish/wsb-mcp.exe).VersionInfo.ProductVersion.Split('+')[0]
          if ($product -ne $env:VERSION) { throw "Published exe has version '$product', expected '$env:VERSION'." }
          Copy-Item LICENSE, README.md, SECURITY.md, SPEC.md publish/

          New-Item -ItemType Directory dist | Out-Null
          $zip = "dist/wsb-mcp-$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload release package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.test.outputs.version }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = (Get-ChildItem dist -File).FullName

          # Re-runnable: a draft from a failed earlier run is reused; a published
          # release is never touched again.
          $existing = gh release view $env:TAG --json isDraft 2>$null | ConvertFrom-Json
          if ($null -eq $existing) {
              $flags = @('--draft', '--verify-tag', '--generate-notes', '--title', "wsb-mcp $env:VERSION")
              if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
              gh release create $env:TAG @assets @flags
              if ($LASTEXITCODE) { throw "gh release create failed ($LASTEXITCODE)." }
          } elseif ($existing.isDraft) {
              gh release upload $env:TAG @assets --clobber
              if ($LASTEXITCODE) { throw "gh release upload failed ($LASTEXITCODE)." }
          } else {
              throw "Release $env:TAG is already published; refusing to change it."
          }

          # Publish only after all assets are uploaded.
          gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE) { throw "gh release edit failed ($LASTEXITCODE)." }
