# Builds and runs the tests against the fake wsb.exe (no Windows Sandbox needed).
# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a pre-release) additionally publishes
# a GitHub release with the zipped broker/proxy build, after the tests passed.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Broker tests
        run: dotnet run --project tests/WsbMcp.Tests -c Release --no-build
      - name: PowerShell module tests (PowerShell 7)
        shell: pwsh
        run: ./tests/WindowsSandboxTest.Tests.ps1
      - name: PowerShell module tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/WindowsSandboxTest.Tests.ps1

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
              throw "Tag '$env:TAG' is not of the form vX.Y.Z or vX.Y.Z-suffix."
          }
          $version = $Matches[1]
          $prerelease = [bool]$Matches[2]

          dotnet publish src/WsbMcp -c Release -r win-x64 --self-contained false `
              "-p:Version=$version" -o publish
          if ($LASTEXITCODE) { throw "dotnet publish failed ($LASTEXITCODE)." }
          Copy-Item LICENSE, README.md, SECURITY.md publish/

          New-Item -ItemType Directory dist | Out-Null
          $zip = "dist/wsb-mcp-$version-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

          $flags = @('--verify-tag', '--generate-notes', '--title', "wsb-mcp $version")
          if ($prerelease) { $flags += '--prerelease' }
          gh release create $env:TAG dist/* @flags
          if ($LASTEXITCODE) { throw "gh release create failed ($LASTEXITCODE)." }
