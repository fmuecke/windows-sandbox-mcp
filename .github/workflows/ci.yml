# Builds and runs the tests against the fake wsb.exe (no Windows Sandbox needed).
# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a pre-release) also packages the
# build in the same job, after the tests passed. The release job then attests it
# and publishes it as a GitHub release.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Determine version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_TYPE -eq 'tag') {
              if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
                  throw "Tag '$env:TAG' is not of the form vX.Y.Z or vX.Y.Z-suffix."
              }
              $version = $Matches[1]
              $prerelease = ([bool]$Matches[2]).ToString().ToLowerInvariant()
          } else {
              # Untagged builds keep the csproj version.
              $version = ''
              $prerelease = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

          # The Claude plugin is installed from the repo, not from the release, so its version is
          # committed. A release tag must match it (pre-releases: the X.Y.Z part).
          if ($version) {
              $base = $version.Split('-')[0]
              $plugin = (Get-Content plugins/wsb-mcp/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
              $listed = ((Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json).plugins |
                  Where-Object name -eq 'wsb-mcp').version
              if ($plugin -ne $base -or $listed -ne $base) {
                  throw "Plugin version (plugin.json '$plugin', marketplace.json '$listed') must be '$base' for tag '$env:TAG'."
              }
          }
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # @( ) around the whole if: an if-expression unrolls a one-element array to a
          # string, and splatting a string passes each character as an argument.
          $versionArg = @(if ($env:VERSION) { "-p:Version=$env:VERSION" })
          dotnet build -c Release @versionArg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Broker tests
        run: dotnet run --project tests/WsbMcp.Tests -c Release --no-build
      - name: PowerShell module tests (PowerShell 7)
        shell: pwsh
        run: ./tests/WindowsSandboxTest.Tests.ps1
      - name: PowerShell module tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/WindowsSandboxTest.Tests.ps1

      # Release packaging, same runner and SDK as the tests above: self-contained, single-file,
      # trimmed exes (no .NET needed), and the process-level tests run against the shipped x64 exe.
      - name: Publish release executables
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($rid in 'win-x64', 'win-arm64') {
              dotnet publish src/WsbMcp -c Release -r $rid "-p:Version=$env:VERSION" -o "publish/$rid"
              if ($LASTEXITCODE) { throw "dotnet publish $rid failed ($LASTEXITCODE)." }
              $product = (Get-Item "publish/$rid/wsb-mcp.exe").VersionInfo.ProductVersion.Split('+')[0]
              if ($product -ne $env:VERSION) { throw "$rid exe has version '$product', expected '$env:VERSION'." }
              $extra = @(Get-ChildItem "publish/$rid" -File | Where-Object Name -ne 'wsb-mcp.exe')
              if ($extra) { throw "$rid publish is not a single file: $($extra.Name -join ', ')" }
          }
      - name: Test the shipped x64 executable
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $env:WSB_MCP_EXE = (Resolve-Path publish/win-x64/wsb-mcp.exe).Path
          dotnet run --project tests/WsbMcp.Tests -c Release --no-build -- EndToEndTests.Proxy SetupTests.Process
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist, winget | Out-Null
          $docs = 'LICENSE', 'README.md', 'SECURITY.md', 'SPEC.md'
          function Sha([string]$path) { (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() }

          $zips = @{}
          foreach ($rid in 'win-x64', 'win-arm64') {
              Copy-Item $docs "publish/$rid/"
              $zips[$rid] = "dist/wsb-mcp-$env:VERSION-$rid.zip"
              Compress-Archive -Path "publish/$rid/*" -DestinationPath $zips[$rid]
          }

          # MCPB bundle (Claude Desktop, MCP Registry): manifest + x64 exe; runs 'wsb-mcp.exe proxy'.
          New-Item -ItemType Directory mcpb | Out-Null
          $manifest = Get-Content packaging/mcpb/manifest.json -Raw | ConvertFrom-Json
          $manifest.version = $env:VERSION
          $manifest | ConvertTo-Json -Depth 10 | Set-Content mcpb/manifest.json -Encoding utf8NoBOM
          Copy-Item publish/win-x64/wsb-mcp.exe, LICENSE, README.md mcpb/
          $mcpb = "dist/wsb-mcp-$env:VERSION-win-x64.mcpb"
          Compress-Archive -Path mcpb/* -DestinationPath "$mcpb.zip"
          Move-Item "$mcpb.zip" $mcpb

          # MCP Registry entry pointing at the MCPB release asset.
          $server = Get-Content server.json -Raw | ConvertFrom-Json
          $server.version = $env:VERSION
          $server.packages[0].identifier = "$env:REPO_URL/releases/download/v$env:VERSION/$(Split-Path $mcpb -Leaf)"
          $server.packages[0].fileSha256 = Sha $mcpb
          $server | ConvertTo-Json -Depth 10 | Set-Content dist/server.json -Encoding utf8NoBOM

          # winget manifests (first submission by hand; later ones by the winget job).
          foreach ($template in Get-ChildItem packaging/winget/*.yaml) {
              (Get-Content $template -Raw).
                  Replace('{{VERSION}}', $env:VERSION).
                  Replace('{{DATE}}', (Get-Date -Format 'yyyy-MM-dd')).
                  Replace('{{SHA256_X64}}', (Sha $zips['win-x64']).ToUpperInvariant()).
                  Replace('{{SHA256_ARM64}}', (Sha $zips['win-arm64']).ToUpperInvariant()) |
                  Set-Content "winget/$($template.Name)" -Encoding utf8NoBOM
          }

          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object { "$(Sha $_.FullName)  $($_.Name)" } |
              Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload release package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
      - name: Upload winget manifests
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: winget/
          if-no-files-found: error

  # Validates packaging metadata with third-party tools from npm. Kept in its own job, so those
  # tools never run where release artifacts are produced or published.
  validate-packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb validate packaging/mcpb/manifest.json
      - name: Validate Claude plugin marketplace
        run: npx --yes @anthropic-ai/claude-code plugin validate .

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.mcpb
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.test.outputs.version }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @((Get-ChildItem dist -File).FullName)

          # Re-runnable: a draft from a failed earlier run is reused; a published
          # release is never touched again.
          $existing = gh release view $env:TAG --json isDraft 2>$null | ConvertFrom-Json
          if ($null -eq $existing) {
              $flags = @('--draft', '--verify-tag', '--generate-notes', '--title', "wsb-mcp $env:VERSION")
              if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
              gh release create $env:TAG @assets @flags
              if ($LASTEXITCODE) { throw "gh release create failed ($LASTEXITCODE)." }
          } elseif ($existing.isDraft) {
              gh release upload $env:TAG @assets --clobber
              if ($LASTEXITCODE) { throw "gh release upload failed ($LASTEXITCODE)." }
          } else {
              throw "Release $env:TAG is already published; refusing to change it."
          }

          # Publish only after all assets are uploaded.
          gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE) { throw "gh release edit failed ($LASTEXITCODE)." }

  # MCP Registry: final releases only, after the MCPB asset is public (the registry checks its hash).
  # Only the OIDC permission, which mcp-publisher exchanges for a registry token for io.github.fmuecke/*.
  registry:
    needs: [test, release]
    if: github.ref_type == 'tag' && needs.test.outputs.prerelease == 'false'
    runs-on: windows-latest
    permissions:
      id-token: write
    env:
      # Pinned tool: fill in a release tag of modelcontextprotocol/registry and the SHA-256 of its
      # mcp-publisher_windows_amd64.tar.gz (README "Releasing"). The job refuses other bytes.
      MCP_PUBLISHER_VERSION: v1.8.8
      MCP_PUBLISHER_SHA256: 20417546bc6798acee317570c0d4041840069e081baa562dc9414c651eb274fa
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Publish to the MCP Registry
        shell: pwsh
        working-directory: dist
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MCP_PUBLISHER_VERSION -eq 'TODO') { throw 'Pin MCP_PUBLISHER_VERSION and MCP_PUBLISHER_SHA256 in ci.yml first.' }
          $url = "https://github.com/modelcontextprotocol/registry/releases/download/$env:MCP_PUBLISHER_VERSION/mcp-publisher_windows_amd64.tar.gz"
          Invoke-WebRequest $url -OutFile mcp-publisher.tar.gz
          $actual = (Get-FileHash mcp-publisher.tar.gz -Algorithm SHA256).Hash
          if ($actual -ne $env:MCP_PUBLISHER_SHA256) { throw "mcp-publisher checksum mismatch: got $actual." }
          tar -xzf mcp-publisher.tar.gz mcp-publisher.exe
          ./mcp-publisher.exe login github-oidc
          if ($LASTEXITCODE) { throw "mcp-publisher login failed ($LASTEXITCODE)." }
          ./mcp-publisher.exe publish
          if ($LASTEXITCODE) { throw "mcp-publisher publish failed ($LASTEXITCODE)." }

  # winget: final releases only. Opens a pull request to microsoft/winget-pkgs for a package that
  # already exists there (the first version is submitted by hand from the winget-manifests
  # artifact). Enabled by the repository variable WINGET_AUTOSUBMIT=true plus the secret
  # WINGET_TOKEN (classic PAT, public_repo scope, for the fork and the pull request).
  winget:
    needs: [test, release]
    if: github.ref_type == 'tag' && needs.test.outputs.prerelease == 'false' && vars.WINGET_AUTOSUBMIT == 'true'
    runs-on: windows-latest
    permissions: {}
    env:
      # Pinned tool: fill in a release tag of microsoft/winget-create and the SHA-256 of its
      # wingetcreate.exe (README "Releasing"). The job refuses other bytes.
      WINGETCREATE_VERSION: v1.12.13.0
      WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea
    steps:
      - name: Submit update to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.test.outputs.version }}
          BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINGETCREATE_VERSION -eq 'TODO') { throw 'Pin WINGETCREATE_VERSION and WINGETCREATE_SHA256 in ci.yml first.' }
          Invoke-WebRequest "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_VERSION/wingetcreate.exe" -OutFile wingetcreate.exe
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($actual -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate checksum mismatch: got $actual." }
          ./wingetcreate.exe update fmuecke.WsbMcp --version $env:VERSION `
              --urls "$env:BASE/wsb-mcp-$env:VERSION-win-x64.zip|x64" "$env:BASE/wsb-mcp-$env:VERSION-win-arm64.zip|arm64" `
              --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE) { throw "wingetcreate failed ($LASTEXITCODE)." }
